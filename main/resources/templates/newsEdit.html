<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${title}">Редактирование новости</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div th:insert="fragments/navtab"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <div class="container mt-3" sec:authorize="hasAuthority('ADMIN')">
        <h2>Редактировать новость</h2>
        <div th:if="${filename != null}" class="mb-3">
            <p class="text-muted mb-1">Текущая картинка:</p>
            <img th:src="@{'/img/' + ${filename}}" style="max-height: 200px;" />
        </div>
        <form th:action="@{/news/edit}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" name="id" th:value="${id}" />
            <textarea name="text" th:text="${text}"
                      class="form-control mb-2" rows="4" required maxlength="4096"></textarea>
            <p class="text-muted small mb-1">Поменять картинку (необязательно):</p>
            <input type="file" name="file" class="mb-3" />

            <button type="submit" class="btn btn-danger">Сохранить</button>
            <a href="/news" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</body>
</html>
