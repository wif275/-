<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${title}">Калькулятор</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:insert="fragments/navtab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="mt-2">
    <h2>Калькулятор стоимости</h2>

    <div class="mb-3">
        <p class="mb-1"><b>Товар:</b> <span th:text="${tag}">Название</span></p>
        <p class="mb-1"><b>Цена за м²:</b> <span th:text="${price}">0</span> ₽</p>
    </div>

    <form method="post" th:action="@{'/calculator/' + ${id}}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="number" step="0.01" min="0.01" name="area"
               placeholder="Введите площадь, м²"
               th:value="${area}"
               class="form-control mb-2" required/>
        <button type="submit" class="btn btn-red-500">Рассчитать</button>
    </form>

    <div th:if="${total != null and total > 0}" class="mt-3 p-3 border rounded bg-light">
        <h4 class="mb-0">Итого: <span th:text="${#numbers.formatDecimal(total, 1, 2)}">0</span> ₽</h4>
    </div>
</div>
</body>
</html>
