<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text=${title} />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div th:insert="fragments/navtab"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <div class="container">
        <div class="mt-2">
            <h2></h2>
            <form th:action="@{/request}" method="get">
                <input type="checkbox" name="filter" th:value="true" th:checked="${filter}"
                    onchange="this.form.submit()">
                Показать Новые
            </form>
        </div>
        <div th:insert="fragments/pager"></div>
        <h2>Заявки</h2>
        <div>
            <div th:each="request : ${page.content}">
                <div class="m-2">
                    <div class="card d-flex flex-column">
                        <div class="card-header">
                            <span th:text="${request.nameR}"></span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <em th:text="${request.textR}" class="card-title"></em><br/>
                            Телефон:
                            <em th:text="${request.numberR}" class="card-text"></em>

                            <div th:if="${!request.finished}">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                                    <form th:action="@{/request}" method="post" style="display:inline;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id" th:value="${request.id}" />
                                        <input type="hidden" name="filter" th:value="${filter}" />
                                        <button type="submit" class="btn btn-danger">Завершить</button> 
                                    </form>
                                    <form th:action="@{/request/delete}" method="post" style="display:inline;"
                                          onsubmit="return confirm('Удалить эту заявку?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <input type="hidden" name="id" th:value="${request.id}" />
                                        <input type="hidden" name="filter" th:value="${filter}" />
                                        <button type="submit" class="btn btn-secondary">Удалить</button>
                                    </form>
                                </div>
                            </div>

                            <div th:if="${request.finished}" style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
                                <span>Завершена</span>
                                <form th:action="@{/request/delete}" method="post" style="display:inline;"
                                      onsubmit="return confirm('Удалить эту заявку?');">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                    <input type="hidden" name="id" th:value="${request.id}" />
                                    <input type="hidden" name="filter" th:value="${filter}" />
                                    <button type="submit" class="btn btn-secondary">Удалить</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:insert="fragments/pager"></div>
    </div>
</body>
</html>
