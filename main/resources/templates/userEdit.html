<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <title>Редактирование пользователей</title> 
    <link rel="stylesheet" href="/static/style.css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:insert="fragments/navtab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="container mt-3">
    <h2>Редактирование пользователя</h2>
    <form action="/user" method="post" th:object="${user}">

        <div class="mb-2">
            <label class="form-label">Имя пользователя</label>
            <input type="text" th:field="*{username}" class="form-control" />
        </div>

        <div class="mb-2">
            <label class="form-label d-block">Роль</label>
            <div th:each="role : ${roles}" class="form-check">
                <input type="radio" name="roles"
                       th:id="${'role-' + role.id}"
                       th:value="${role.name}"
                       th:checked="${user.role != null and user.role.id == role.id}"
                       class="form-check-input" />
                <label class="form-check-label" th:for="${'role-' + role.id}" th:text="${role.name}"></label>
            </div>
        </div>

        <input type="hidden" th:value="${user.id}" name="userId" />
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="javascript:history.back()" class="btn btn-secondary">Назад</a>
    </form>
</div>
</body>
</html>
