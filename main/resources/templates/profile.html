<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
    <title>Профиль</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous" />
</head>
<body>
    <div th:insert="fragments/navtab"></div>

    <div class="container mt-5 text-center mb-2">
        <div class="mb-2" th:text="${username}">Имя пользователя</div>
        <span th:text="${message}">Текст</span>
        <form  method="post" class="d-flex flex-column align-items-center">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="mb-3 col-sm-5 w-100">
                <input type="password" name="password" class="form-control" placeholder="Пароль" autocomplete="off"/>
            </div>
            <div class="mb-3 col-sm-5 w-100">
                <input type="email" name="email" class="form-control" placeholder="@Email" th:value="${email ?:''}"/>
            </div>
            <div>
                <input type="submit" value="Сохранить" class="btn btn-primary"/>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" 
            crossorigin="anonymous"></script>
</body>
</html>
