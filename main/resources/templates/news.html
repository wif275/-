<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${title}">Новости</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div th:insert="fragments/navtab"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <div class="container-xl">
        <div class="accordion mt-3" sec:authorize="hasAuthority('ADMIN')">
            <div class="accordion-item">
                <h2 class="accordion-header" id="newsHeading">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#newsCollapse" aria-expanded="true" aria-controls="newsCollapse">
                        <b>Добавить новость</b>
                    </button>
                </h2>
                <div id="newsCollapse" class="accordion-collapse collapse show" aria-labelledby="newsHeading">
                    <div class="mt-2 accordion-body">
                        <form th:action="@{/news/add}" method="post" enctype="multipart/form-data">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <textarea name="text" placeholder="Текст новости"
                                      class="form-control mb-2" rows="4" required maxlength="4096"></textarea>
                            <input type="file" name="file" class="mb-2"><br />
                            <button type="submit" class="btn btn-danger">Опубликовать</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="my-3">
            <h2>Новости</h2>
        </div>
        <div th:if="${page.content.isEmpty()}" class="text-muted m-2">
            Новостей пока нет.
        </div>
        <div th:insert="fragments/pager"></div>
        <div class="row row-cols-1 row-cols-md-2 g-4">
            <div th:each="news : ${page.content}">
                <div class="card my-3 mx-2">
                    <div th:if="${news.filename != null}">
                        <img th:src="@{'/img/' + ${news.filename}}" class="card-img-top"
                             style="max-height: 300px; object-fit: cover;" />
                    </div>
                    <div class="card-body">
                        <p class="card-text" th:text="${news.text}"></p>
                        <div class="card-footer text-muted px-0" sec:authorize="hasAuthority('ADMIN')">
                            <a class="btn btn-secondary btn-danger"
                                th:href="@{'/news/edit?id=' + ${news.id}}">Изменить</a>

                            <form th:action="@{/news/delete}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Удалить эту новость?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="id" th:value="${news.id}" />
                                <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:insert="fragments/pager"></div>
    </div>
</body>
</html>
