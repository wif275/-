<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text="${title}">Отзывы</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .stars {
            color: #E53935;
            font-size: 1.2rem;
            letter-spacing: 2px;
        }
        .star-empty {
            color: #ccc;
        }
        .rating-input {
            display: inline-flex;
            flex-direction: row-reverse;
            gap: 4px;
        }
        .rating-input input[type="radio"] {
            display: none;
        }
        .rating-input label {
            font-size: 1.8rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.15s;
        }
        .rating-input label:hover,
        .rating-input label:hover ~ label,
        .rating-input input[type="radio"]:checked ~ label {
            color: #E53935;
        }
    </style>
</head>

<body>
    <div th:insert="fragments/navtab"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <div class="container">

        <div class="mt-3" sec:authorize="isAuthenticated()" th:if="${!userHasReview}">
            <h2>Оставить отзыв</h2>
            <form method="post" th:action="@{/reviews}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <div class="mb-2">
                    <label class="form-label d-block mb-1">Оценка:</label>
                    <div class="rating-input">
                        <input type="radio" id="star5" name="rating" value="5" required/>
                        <label for="star5">★</label>
                        <input type="radio" id="star4" name="rating" value="4"/>
                        <label for="star4">★</label>
                        <input type="radio" id="star3" name="rating" value="3"/>
                        <label for="star3">★</label>
                        <input type="radio" id="star2" name="rating" value="2"/>
                        <label for="star2">★</label>
                        <input type="radio" id="star1" name="rating" value="1"/>
                        <label for="star1">★</label>
                    </div>
                </div>

                <textarea name="text" placeholder="Ваш отзыв"
                          class="form-control mb-2" rows="3" required maxlength="2000"></textarea>

                <button type="submit" class="btn btn-primary">Отправить отзыв</button>
            </form>
        </div>

        <div class="mt-3 alert alert-info" sec:authorize="isAuthenticated()" th:if="${userHasReview}">
            Вы уже оставили отзыв. Спасибо!
        </div>

        <div class="mt-3" sec:authorize="!isAuthenticated()">
            <p class="text-muted">
                <a th:href="@{/login}">Войдите</a>, чтобы оставить отзыв.
            </p>
        </div>

        <h2 class="mt-4">Отзывы</h2>
        <div>
            <div th:if="${reviews.isEmpty()}" class="text-muted">
                Пока отзывов нет. Будь первым.
            </div>

            <div th:each="review : ${reviews}">
                <div class="m-2">
                    <div class="card d-flex flex-column">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span th:text="${review.authorName}">username</span>
                            <span class="stars">
                                <span th:each="i : ${#numbers.sequence(1, 5)}">
                                    <span th:if="${i &lt;= review.rating}">★</span>
                                    <span th:if="${i &gt; review.rating}" class="star-empty">★</span>
                                </span>
                            </span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <em th:text="${review.text}" class="card-title"></em><br/>
                            <small class="text-muted"
                                   th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}">
                                01.01.2026 12:00
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
