<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"   
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head> 
    <title th:text="${title}">Редактировать сообщение</title> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:insert="fragments/navtab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="mt-2" sec:authorize="hasAuthority('ADMIN')">
    <h2>Изменить Сообщение</h2>
    <form method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" name="id" th:value="${id}">
        <input type="text" name="text" placeholder="Введите сообщение" th:value="${text}" class="form-control mb-2"/>
        <input type="text" name="tag" placeholder="Тэг" th:value="${tag}" class="form-control mb-2"/>
        <input type="number" name="price" placeholder="Цена" th:value="${price}" class="form-control mb-2"/>
        <input type="file" name="file" class="form-control mb-2"/>
        <button type="submit" class="btn btn-primary">Изменить</button>
    </form>
</div>
</body>
</html>
