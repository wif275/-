<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"   
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head> 
    <title th:text=${title}/> 
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div th:insert="fragments/navtab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="container">
    <div class="mt-2">
        <h2>Написать Заявку</h2>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/request.send}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <label class="form-label mt-2">Имя</label>
            <input type="text" th:value="${username}" class="mb-2 form-control" disabled />

            <label class="form-label">Телефон</label>
            <input type="text" th:value="${number}" class="mb-2 form-control" disabled />

            <label class="form-label">Описание заявки</label>
            <textarea name="textR" placeholder="Опишите, что вам нужно"
                      class="mb-2 form-control" rows="4" required maxlength="4096"></textarea>

            <button type="submit" class="btn btn-danger">Отправить</button>
        </form>
    </div>
</div>
</body>
</html>
