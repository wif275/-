<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <title th:text=${title} />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="/static/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div th:insert="fragments/navtab"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <div class="container-xl">
        <div class="mt-2">
            <h2>Поиск по Названию</h2>
            <form th:action="@{/data}" method="get">
                <input type="text" name="filter" placeholder="Название" th:value="${filter}">
                <button type="submit" class="ms-2 btn btn-danger">Найти</button>
            </form>
        </div>
        <div class="accordion mt-3">
            <div class="accordion-item" sec:authorize="hasAuthority('ADMIN')">
                <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse"
                        data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        <b>Добавить товар</b>
                    </button>
                </h2>
                <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne"
                    data-bs-parent="#accordionExample">
                    <div class="mt-2 accordion-body">
                        <form th:action="@{/data/add}" method="post" enctype="multipart/form-data">
                            <input type="tag" name="tag" placeholder="Название" class="mb-2 form-control" /> <br />
                            <textarea type="text" name="text" placeholder="Введите сообщение" class="form-control" rows="3"></textarea><br/>
                            <input type="number" name="price" placeholder="Цена" class="mb-2 form-control" /> <br />
                            <input type="file" name="file" class="mb-2"> <br />
                            <button type="submit" class="ms-2 btn btn-danger">Добавить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="my-3">
            <h2>Каталог</h2>
        </div>
        <div th:insert="fragments/pager"></div>
        <div class="row row-cols-1 row-cols-md-3 g-4">
            <div th:each="msg : ${page.content}">
                <div class="card my-3 mx-2">
                    <div th:if="${msg.filename != null}">
                        <img th:src="@{'/img/' + ${msg.filename}}" class="card-img-top" />
                    </div>
                    <div class="card-body">
                        <div class="m-2">
                            <b th:text="${msg.tag}"></b><br />
                            <span th:text="${msg.text}"></span><br />
                            <span th:text="${msg.price}"></span> руб
                        </div>
                        <div><a class="btn btn-red-500" 
                                th:href="@{'/calculator/' + ${msg.id}}">Рассчитать</a></div>
                        <div class="card-footer text-muted" sec:authorize="hasAuthority('ADMIN')">
                            <strong th:text="${msg.authorName}"></strong>
                            <a class="btn btn-red-500"
                                th:href="@{'/edit?id=' + ${msg.id}}">Изменить</a>
                            /
                            <form th:action="@{/data/delete}" method="post" style="display:inline;"
                                  onsubmit="return confirm('Удалить этот товар?');">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                <input type="hidden" name="id" th:value="${msg.id}" />
                                <button type="submit" class="btn btn-red-500">Удалить</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div th:insert="fragments/pager"></div>
        <div>
            <b th:text="${id}">ID</b>
            <span th:text="${text}">Текст</span>
            <i th:text="${tag}">Тэг</i>
            <i th:text="${price}">Цена</i>
            <strong th:text="${authorName}">Автор</strong>
        </div>
    </div>
</body>

</html>
