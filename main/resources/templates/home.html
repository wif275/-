<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head> 
    <title th:text=${title}/> 
    <link rel="stylesheet" href="/static/style.css">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
     rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .news-card-home {
            min-height: 100%;
        }
        .news-card-home img {
            max-height: 220px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<div th:insert="fragments/navtab"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

<div class="container mt-5">
    <h2 th:text="|Привет, ${title}!|"></h2>
    <div> 
        <h4>Знаете, чего хотите? Мы поможем! Не знаете? Все равно поможем!</h4>
    </div>

    <!-- Блок новостей -->
    <div class="mt-5" th:if="${topNews != null and !topNews.isEmpty()}">
        <h3>Новости</h3>
        <div class="row mt-3">
            <div class="col-md-6 mb-3" th:each="news : ${topNews}">
                <div class="card news-card-home">
                    <img th:if="${news.filename != null}"
                         th:src="@{'/img/' + ${news.filename}}"
                         class="card-img-top" />
                    <div class="card-body">
                        <p class="card-text" th:text="${news.text}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Блок отзывов -->
    <div class="mt-5" th:if="${topReviews != null and !topReviews.isEmpty()}">
        <h3>Что говорят наши клиенты</h3>
        <div class="row mt-3">
            <div class="col-md-6 col-lg-4 mb-3" th:each="review : ${topReviews}">
                <div class="card review-card-home">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span th:text="${review.authorName}">username</span>
                        <span class="stars-home">
                            <span th:each="i : ${#numbers.sequence(1, 5)}">
                                <span th:if="${i &lt;= review.rating}">★</span>
                                <span th:if="${i &gt; review.rating}" class="star-empty-home">★</span>
                            </span>
                        </span>
                    </div>
                    <div class="card-body">
                        <em th:text="${review.text}" class="card-title"></em>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-3 mb-5">
            <a th:href="@{/reviews}" class="btn btn-outline-primary">Все отзывы</a>
        </div>
    </div>
</div>
</body>
</html>
